
name: Build PRO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pro_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: pro_app
        run: flutter pub get

      - name: Build APK
        working-directory: pro_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRO-Android-APK
          path: pro_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
