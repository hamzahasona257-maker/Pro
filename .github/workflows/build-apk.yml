
name: Build PRO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pro_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android Gradle Wrapper
        working-directory: pro_app
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.pro /tmp/pro_android_tpl
            cp /tmp/pro_android_tpl/android/gradlew android/gradlew
            cp /tmp/pro_android_tpl/android/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp -r /tmp/pro_android_tpl/android/gradle/wrapper/* android/gradle/wrapper/
            chmod +x android/gradlew
            rm -rf /tmp/pro_android_tpl
          fi

      - name: Install dependencies & generate localizations
        working-directory: pro_app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build APK
        working-directory: pro_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRO-Android-APK
          path: pro_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
